<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PEPEPE RANKING</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080b12;
            --bg2: #101622;
            --card: rgba(20, 27, 42, 0.92);
            --card2: rgba(27, 36, 55, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f4f7ff;
            --sub: #8e9ab0;
            --accent: #6fa8ff;
            --accent2: #9b6cff;
            --gold: #ffd86b;
            --silver: #d8dee9;
            --bronze: #d69b6a;
            --green: #53e0a0;
            --danger: #ff6b7a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(111, 168, 255, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at top right,
                    rgba(155, 108, 255, 0.10),
                    transparent 25%
                ),
                linear-gradient(
                    180deg,
                    #080b12 0%,
                    #0b1019 100%
                );
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 30px 0 60px;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            padding: 35px 20px;
            margin-bottom: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.05),
                    rgba(255,255,255,0.01)
                );

            border: 1px solid var(--border);
            border-radius: 24px;

            box-shadow:
                0 20px 80px rgba(0,0,0,0.35);

            position: relative;
            overflow: hidden;
        }

        header::before {
            content: "";
            position: absolute;

            width: 350px;
            height: 350px;

            background:
                radial-gradient(
                    circle,
                    rgba(111,168,255,0.16),
                    transparent 70%
                );

            top: -200px;
            left: 50%;

            transform: translateX(-50%);
        }

        .logo {
            position: relative;
            z-index: 1;

            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;

            letter-spacing: 0.12em;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #6fa8ff,
                    #9b6cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 40px rgba(111,168,255,0.2);
        }

        .subtitle {
            position: relative;
            z-index: 1;

            margin-top: 8px;

            color: var(--sub);

            letter-spacing: 0.25em;

            font-size: 0.8rem;
        }

        .status {
            position: relative;
            z-index: 1;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 20px;

            padding: 8px 14px;

            border-radius: 999px;

            background:
                rgba(83,224,160,0.08);

            border:
                1px solid rgba(83,224,160,0.2);

            color: var(--green);

            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {
            padding: 20px;

            background:
                rgba(20,27,42,0.75);

            border:
                1px solid var(--border);

            border-radius: 18px;

            text-align: center;
        }

        .stat-label {
            color: var(--sub);

            font-size: 0.75rem;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 800;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;

            flex-direction: column;

            gap: 15px;

            margin-bottom: 30px;
        }

        .tabs {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .tab {
            flex: 1;

            min-width: 120px;

            border: none;

            padding: 13px 15px;

            border-radius: 12px;

            cursor: pointer;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid var(--border);

            color: var(--sub);

            transition:
                0.2s ease;
        }

        .tab:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.07);
        }

        .tab.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(111,168,255,0.3),
                    rgba(155,108,255,0.25)
                );

            border-color:
                rgba(111,168,255,0.5);

            box-shadow:
                0 8px 30px rgba(111,168,255,0.12);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;

            padding:
                15px 18px;

            border-radius: 14px;

            border:
                1px solid var(--border);

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.04);

            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color:
                rgba(111,168,255,0.7);

            box-shadow:
                0 0 0 4px rgba(111,168,255,0.08);
        }

        /* =========================
           TOP 3
        ========================= */

        .podium {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .top-card {
            position: relative;

            padding: 25px 20px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(30,38,56,0.95),
                    rgba(14,19,30,0.95)
                );

            border:
                1px solid var(--border);

            overflow: hidden;

            transition:
                0.25s ease;
        }

        .top-card:hover {
            transform:
                translateY(-6px);
        }

        .top-card.rank-1 {
            border-color:
                rgba(255,216,107,0.55);

            box-shadow:
                0 0 45px rgba(255,216,107,0.10);
        }

        .top-card.rank-2 {
            border-color:
                rgba(216,222,233,0.35);
        }

        .top-card.rank-3 {
            border-color:
                rgba(214,155,106,0.35);
        }

        .medal {
            font-size: 2rem;

            margin-bottom: 12px;
        }

        .rank-label {
            color: var(--sub);

            font-size: 0.7rem;

            letter-spacing: 0.15em;

            margin-bottom: 8px;
        }

        .top-name {
            font-size: 1.15rem;

            font-weight: 800;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .top-trip {
            margin-top: 5px;

            color: var(--sub);

            font-size: 0.7rem;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .top-money-label {
            margin-top: 20px;

            color: var(--sub);

            font-size: 0.7rem;
        }

        .top-money {
            margin-top: 4px;

            font-size: clamp(1rem, 3vw, 1.5rem);

            font-weight: 900;

            color: var(--gold);
        }

        /* =========================
           RANKING LIST
        ========================= */

        .ranking {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .player-card {
            display: grid;

            grid-template-columns:
                65px 1fr auto;

            align-items: center;

            gap: 15px;

            padding: 16px 18px;

            border-radius: 16px;

            background:
                rgba(20,27,42,0.78);

            border:
                1px solid var(--border);

            transition:
                0.2s ease;
        }

        .player-card:hover {
            transform:
                translateX(5px);

            border-color:
                rgba(111,168,255,0.4);

            background:
                rgba(29,38,58,0.9);
        }

        .rank-number {
            font-size: 1.1rem;

            font-weight: 900;

            color: var(--sub);

            text-align: center;
        }

        .player-name {
            font-weight: 800;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-trip {
            margin-top: 5px;

            font-size: 0.72rem;

            color: var(--sub);

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-money {
            text-align: right;

            font-weight: 800;

            color: var(--green);

            white-space: nowrap;
        }

        .empty {
            text-align: center;

            padding: 50px 20px;

            color: var(--sub);

            background:
                rgba(20,27,42,0.6);

            border:
                1px dashed var(--border);

            border-radius: 20px;
        }

        .loading {
            text-align: center;

            padding: 70px 20px;

            color: var(--sub);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 40px;

            text-align: center;

            color: #667085;

            font-size: 0.75rem;

            line-height: 1.8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .container {
                width: min(94%, 700px);
                padding-top: 15px;
            }

            header {
                padding: 28px 15px;
                border-radius: 20px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

            .podium {
                grid-template-columns:
                    1fr;
            }

            .top-card.rank-1 {
                order: -1;
            }

            .player-card {
                grid-template-columns:
                    45px 1fr;
            }

            .player-money {
                grid-column:
                    2;

                text-align: left;

                margin-top: -8px;
            }

            .tabs {
                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .tab {
                min-width: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">
            PEPEPE
        </div>

        <div class="subtitle">
            OFFICIAL ECONOMY LEADERBOARD
        </div>

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

    </header>


    <!-- =========================
         STATS
    ========================== -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-label">
                REGISTERED PLAYERS
            </div>

            <div
                class="stat-value"
                id="playerCount"
            >
                -
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                CURRENT RANKING
            </div>

            <div
                class="stat-value"
                id="rankingType"
            >
                TOTAL ASSETS
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                LAST UPDATED
            </div>

            <div
                class="stat-value"
                id="updated"
            >
                -
            </div>

        </div>

    </section>


    <!-- =========================
         CONTROLS
    ========================== -->

    <section class="controls">

        <div class="tabs">

            <button
                class="tab active"
                data-type="totalAssets"
            >
                🔱 総資産
            </button>

            <button
                class="tab"
                data-type="money"
            >
                💰 所持金
            </button>

            <button
                class="tab"
                data-type="bank"
            >
                🏦 銀行
            </button>

            <button
                class="tab"
                data-type="stockAssets"
            >
                📈 株式
            </button>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="プレイヤー名を検索..."
            >

        </div>

    </section>


    <!-- =========================
         TOP 3
    ========================== -->

    <section
        class="podium"
        id="podium"
    >
    </section>


    <!-- =========================
         RANKING
    ========================== -->

    <section
        class="ranking"
        id="ranking"
    >

        <div class="loading">
            RANKING DATA LOADING...
        </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        PEPEPE OFFICIAL RANKING<br>

        DATA AUTOMATICALLY SYNCHRONIZED

    </footer>

</div>


<script>

    let users = []

    let currentType = "totalAssets"


    // =========================
    // 金額フォーマット
    // =========================

    function formatMoney(value) {

        return Number(
            value || 0
        ).toLocaleString("ja-JP")

    }


    // =========================
    // ランキング名
    // =========================

    function getRankingName(type) {

        const names = {

            totalAssets:
                "TOTAL ASSETS",

            money:
                "CASH",

            bank:
                "BANK",

            stockAssets:
                "STOCK ASSETS"

        }

        return names[type] || type

    }


    // =========================
    // メダル
    // =========================

    function getMedal(rank) {

        if (rank === 1) {
            return "🥇"
        }

        if (rank === 2) {
            return "🥈"
        }

        if (rank === 3) {
            return "🥉"
        }

        return "#" + rank

    }


    // =========================
    // ランキング描画
    // =========================

    function renderRanking() {

        const ranking =
            document.getElementById(
                "ranking"
            )

        const podium =
            document.getElementById(
                "podium"
            )

        const search =
            document.getElementById(
                "search"
            ).value
            .trim()
            .toLowerCase()


        // =========================
        // ソート
        // =========================

        let sorted = [...users]

        sorted.sort(
            (a, b) =>

                Number(
                    b[currentType] || 0
                )

                -

                Number(
                    a[currentType] || 0
                )
        )


        // =========================
        // 検索
        // =========================

        if (search) {

            sorted =
                sorted.filter(
                    user => {

                        const name =
                            String(
                                user.name || ""
                            ).toLowerCase()

                        const trip =
                            String(
                                user.trip || ""
                            ).toLowerCase()

                        return (
                            name.includes(search)
                            ||
                            trip.includes(search)
                        )

                    }
                )

        }


        // =========================
        // 現在ランキング名
        // =========================

        document.getElementById(
            "rankingType"
        ).textContent =
            getRankingName(
                currentType
            )


        // =========================
        // 空
        // =========================

        if (
            sorted.length === 0
        ) {

            podium.innerHTML = ""

            ranking.innerHTML =
                `
                <div class="empty">
                    該当するプレイヤーがいません
                </div>
                `

            return

        }


        // =========================
        // TOP 3
        // =========================

        const top3 =
            sorted.slice(
                0,
                3
            )

        const topOrder = []

        if (top3[1]) {
            topOrder.push({
                user: top3[1],
                rank: 2
            })
        }

        if (top3[0]) {
            topOrder.push({
                user: top3[0],
                rank: 1
            })
        }

        if (top3[2]) {
            topOrder.push({
                user: top3[2],
                rank: 3
            })
        }


        podium.innerHTML =
            topOrder.map(
                item => {

                    const user =
                        item.user

                    const rank =
                        item.rank

                    return `
                    <div
                        class="
                            top-card
                            rank-${rank}
                        "
                    >

                        <div class="medal">
                            ${getMedal(rank)}
                        </div>

                        <div class="rank-label">
                            ${rank} PLACE
                        </div>

                        <div class="top-name">
                            ${user.name || "Unknown"}
                        </div>

                        <div class="top-trip">
                            ${user.trip || ""}
                        </div>

                        <div class="top-money-label">
                            ${getRankingName(currentType)}
                        </div>

                        <div class="top-money">
                            ¥${formatMoney(
                                user[currentType]
                            )}
                        </div>

                    </div>
                    `

                }
            ).join("")


        // =========================
        // 4位以下
        // =========================

        const others =
            sorted.slice(3)


        ranking.innerHTML =
            others.map(
                (
                    user,
                    index
                ) => {

                    const rank =
                        index + 4

                    return `
                    <div class="player-card">

                        <div class="rank-number">
                            #${rank}
                        </div>


                        <div>

                            <div class="player-name">
                                ${user.name || "Unknown"}
                            </div>

                            <div class="player-trip">
                                ${user.trip || ""}
                            </div>

                        </div>


                        <div class="player-money">

                            ¥${formatMoney(
                                user[currentType]
                            )}

                        </div>

                    </div>
                    `

                }
            ).join("")


        // =========================
        // TOP3しかいない場合
        // =========================

        if (
            others.length === 0
        ) {

            ranking.innerHTML =
                `
                <div class="empty">
                    TOP ${top3.length}
                </div>
                `

        }

    }


    // =========================
    // データ読み込み
    // =========================

    async function loadRanking() {

        try {

            const response =
                await fetch(
                    "./ranking.json?t="
                    + Date.now()
                )

            if (
                !response.ok
            ) {

                throw new Error(
                    "ranking.json の読み込みに失敗しました"
                )

            }


            const data =
                await response.json()


            // =========================
            // users取得
            // =========================

            if (
                Array.isArray(
                    data.users
                )
            ) {

                users =
                    data.users

            }

            else if (
                typeof data.users
                === "object"
                &&
                data.users
            ) {

                users =
                    Object.values(
                        data.users
                    )

            }

            else if (
                Array.isArray(
                    data
                )
            ) {

                users =
                    data

            }

            else {

                users = []

            }


            // =========================
            // プレイヤー数
            // =========================

            document.getElementById(
                "playerCount"
            ).textContent =
                users.length.toLocaleString(
                    "ja-JP"
                )


            // =========================
            // 更新時間
            // =========================

            let updated =
                data.updated
                ||
                data.lastUpdated
                ||
                null


            if (
                updated
            ) {

                try {

                    const date =
                        new Date(
                            updated
                        )

                    document.getElementById(
                        "updated"
                    ).textContent =
                        date.toLocaleString(
                            "ja-JP"
                        )

                }

                catch {

                    document.getElementById(
                        "updated"
                    ).textContent =
                        updated

                }

            }

            else {

                document.getElementById(
                    "updated"
                ).textContent =
                    "SYNCED"

            }


            renderRanking()

        }

        catch (error) {

            console.error(
                error
            )

            document.getElementById(
                "ranking"
            ).innerHTML =
                `
                <div class="empty">

                    <h3>
                        DATA CONNECTION ERROR
                    </h3>

                    <br>

                    ranking.json を
                    読み込めませんでした

                </div>
                `

        }

    }


    // =========================
    // TAB
    // =========================

    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".tab"
                            )
                            .forEach(
                                tab => {

                                    tab.classList.remove(
                                        "active"
                                    )

                                }
                            )

                        button.classList.add(
                            "active"
                        )

                        currentType =
                            button.dataset.type

                        renderRanking()

                    }
                )

            }
        )


    // =========================
    // SEARCH
    // =========================

    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            () => {

                renderRanking()

            }
        )


    // =========================
    // START
    // =========================

    loadRanking()


    // =========================
    // 自動更新
    // 30秒ごと
    // =========================

    setInterval(
        loadRanking,
        30000
    )

</script>

</body>
</html>
