<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NETFRFRランキング</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            font-family:
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            color: #f5f5f5;

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(212,175,55,0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 20%,
                    rgba(255,255,255,0.05),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #070707,
                    #101010 45%,
                    #050505
                );

            min-height: 100vh;
        }


        /* =================================
           背景
        ================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px
                );

            background-size:
                40px 40px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );
        }


        /* =================================
           メイン
        ================================= */

        .container {

            width: min(
                1100px,
                calc(100% - 30px)
            );

            margin: 45px auto;

            position: relative;
        }


        /* =================================
           ヘッダー
        ================================= */

        .header {

            position: relative;

            padding: 34px 35px;

            border:
                1px solid
                rgba(212,175,55,0.3);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(30,30,30,0.95),
                    rgba(9,9,9,0.92)
                );

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.55),

                inset 0 1px 0
                rgba(255,255,255,0.05);
        }


        .header::after {

            content: "";

            position: absolute;

            left: 35px;
            right: 35px;
            bottom: 0;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d4af37,
                    transparent
                );

            opacity: 0.7;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .logo {

            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    #f1d67a,
                    #9c7420
                );

            color: #080808;

            font-size: 28px;

            box-shadow:
                0 8px 30px
                rgba(212,175,55,0.2);
        }


        h1 {

            margin: 0;

            font-size: clamp(
                24px,
                4vw,
                38px
            );

            letter-spacing: 0.06em;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #e9d38a,
                    #fff
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .subtitle {

            margin-top: 7px;

            color: #888;

            font-size: 13px;

            letter-spacing: 0.14em;
        }


        /* =================================
           ステータス
        ================================= */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin: 25px 0 0;

            padding: 8px 13px;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid
                rgba(255,255,255,0.08);

            color: #aaa;

            font-size: 12px;
        }


        /* =================================
           検索
        ================================= */

        .search-box {

            margin-top: 25px;

            position: relative;
        }


        .search-icon {

            position: absolute;

            left: 17px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #777;

            font-size: 17px;
        }


        #search {

            width: 100%;

            padding:
                16px
                18px
                16px
                48px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.035);

            font-size: 14px;

            transition:
                0.2s ease;
        }


        #search::placeholder {
            color: #666;
        }


        #search:focus {

            border-color:
                rgba(212,175,55,0.6);

            background:
                rgba(255,255,255,0.055);

            box-shadow:
                0 0 0 4px
                rgba(212,175,55,0.06);
        }


        /* =================================
           タブ
        ================================= */

        .tabs {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 18px;
        }


        .tabs button {

            border: 1px solid
                rgba(255,255,255,0.08);

            border-radius: 13px;

            padding: 14px 10px;

            background:
                rgba(255,255,255,0.035);

            color: #999;

            cursor: pointer;

            font-weight: 700;

            transition:
                0.2s ease;
        }


        .tabs button:hover {

            transform:
                translateY(-2px);

            color: #eee;

            border-color:
                rgba(212,175,55,0.35);
        }


        .tabs button.active {

            color: #111;

            border-color:
                transparent;

            background:
                linear-gradient(
                    135deg,
                    #f2d779,
                    #b78b2b
                );

            box-shadow:
                0 8px 25px
                rgba(212,175,55,0.15);
        }


        /* =================================
           ランキング
        ================================= */

        #ranking {

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 11px;
        }


        .ranking-item {

            display: grid;

            grid-template-columns:
                85px 1fr;

            align-items: center;

            min-height: 82px;

            padding:
                15px 22px;

            border-radius: 17px;

            border:
                1px solid
                rgba(255,255,255,0.07);

            background:
                linear-gradient(
                    110deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                );

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.2);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .ranking-item:hover {

            transform:
                translateY(-3px)
                scale(1.005);

            border-color:
                rgba(212,175,55,0.3);

            background:
                linear-gradient(
                    110deg,
                    rgba(212,175,55,0.08),
                    rgba(255,255,255,0.025)
                );
        }


        .rank {

            font-size: 18px;

            font-weight: 900;

            color: #777;

            text-align: center;
        }


        .user {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        .name {

            font-size: 16px;

            font-weight: 700;

            color: #eee;

            word-break: break-all;
        }


        .value {

            white-space: nowrap;

            font-size: 21px;

            font-weight: 900;

            color: #e4c45f;

            text-shadow:
                0 0 20px
                rgba(212,175,55,0.15);
        }


        /* =================================
           TOP 3
        ================================= */

        .rank-1 {

            border-color:
                rgba(255,215,0,0.45);

            background:
                linear-gradient(
                    110deg,
                    rgba(212,175,55,0.14),
                    rgba(255,255,255,0.025)
                );
        }


        .rank-1 .rank {

            color: #ffd84d;

            font-size: 23px;
        }


        .rank-1 .value {

            color: #ffe27a;

            font-size: 24px;
        }


        .rank-2 {

            border-color:
                rgba(210,210,210,0.22);
        }


        .rank-2 .rank {
            color: #d5d5d5;
        }


        .rank-3 {

            border-color:
                rgba(190,125,65,0.28);
        }


        .rank-3 .rank {
            color: #cd8a52;
        }


        /* =================================
           空状態
        ================================= */

        #ranking > p {

            padding: 45px;

            text-align: center;

            color: #777;

            border-radius: 17px;

            border:
                1px solid
                rgba(255,255,255,0.06);

            background:
                rgba(255,255,255,0.025);
        }


        /* =================================
           フッター
        ================================= */

        .footer {

            margin-top: 25px;

            text-align: center;

            color: #555;

            font-size: 11px;

            letter-spacing: 0.08em;
        }


        /* =================================
           スマホ
        ================================= */

        @media (
            max-width: 700px
        ) {

            .container {

                width:
                    calc(100% - 18px);

                margin:
                    18px auto;
            }


            .header {

                padding: 24px 18px;

                border-radius: 18px;
            }


            .header::after {

                left: 18px;
                right: 18px;
            }


            .brand {

                gap: 12px;
            }


            .logo {

                width: 46px;
                height: 46px;

                font-size: 22px;

                border-radius: 12px;
            }


            .subtitle {

                font-size: 10px;
            }


            .tabs {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .ranking-item {

                grid-template-columns:
                    55px 1fr;

                padding:
                    13px 12px;

                min-height: 72px;
            }


            .user {

                display: block;
            }


            .name {

                font-size: 13px;

                line-height: 1.5;
            }


            .value {

                margin-top: 5px;

                font-size: 18px;
            }


            .rank-1 .value {

                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================
         ヘッダー
    ================================= -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                📂
            </div>

            <div>

                <h1>
                    NETFRFRランキング
                </h1>

                <div class="subtitle">
                    TEA EMPIRE EXCHANGE
                    ・ RANKING BOARD
                </div>

            </div>

        </div>


        <p
            class="status"
            id="status"
        >
            🛜 ランキングデータ接続中...
        </p>


        <!-- 検索 -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="search"
                placeholder="ユーザー名・トリップで検索"
            >

        </div>


        <!-- タブ -->

        <div class="tabs">

            <button
                class="active"
                data-type="totalAssets"
            >
                🔱 総資産
            </button>

            <button
                data-type="money"
            >
                💰 所持金
            </button>

            <button
                data-type="bank"
            >
                🏦 銀行
            </button>

            <button
                data-type="stockAssets"
            >
                📈 株式資産
            </button>

        </div>

    </header>


    <!-- =================================
         ランキング
    ================================= -->

    <main id="ranking">

        <p>
            ランキングデータを読み込んでいます...
        </p>

    </main>


    <div class="footer">

        DATA SOURCE :
        ranking.json
        ・
        AUTO UPDATED

    </div>


</div>


<script>


    // =================================
    // データ
    // =================================

    let users = [];

    let currentType =
        "totalAssets";


    // =================================
    // ranking.json読み込み
    // =================================

    async function loadRanking() {

        try {

            const response =
                await fetch(
                    "ranking.json?" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "ranking.json取得失敗"
                );

            }


            const data =
                await response.json();


            users =
                Array.isArray(
                    data.users
                )
                ? data.users
                : [];


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "🟢 ランキングデータ接続中";


            renderRanking();


        } catch (error) {

            console.error(
                error
            );


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "🔴 ランキングデータ取得失敗";


            document
                .getElementById(
                    "ranking"
                )
                .innerHTML = `

                    <p>
                        ランキングデータを
                        取得できませんでした。
                    </p>

            `;

        }

    }


    // =================================
    // ランキング表示
    // =================================

    function renderRanking() {

        const search =
            document
                .getElementById(
                    "search"
                )
                .value
                .trim()
                .toLowerCase();


        const filtered =
            users.filter(
                user => {

                    const name =
                        String(
                            user.name || ""
                        )
                        .toLowerCase();


                    const trip =
                        String(
                            user.trip || ""
                        )
                        .toLowerCase();


                    return (
                        name.includes(search)
                        ||
                        trip.includes(search)
                    );

                }
            );


        filtered.sort(
            (
                a,
                b
            ) => {

                return (
                    Number(
                        b[currentType] || 0
                    )
                    -
                    Number(
                        a[currentType] || 0
                    )
                );

            }
        );


        const ranking =
            document
                .getElementById(
                    "ranking"
                );


        ranking.innerHTML =
            "";


        if (
            filtered.length === 0
        ) {

            ranking.innerHTML = `

                <p>
                    該当するユーザーが
                    いません。
                </p>

            `;

            return;

        }


        filtered.forEach(
            (
                user,
                index
            ) => {

                const rank =
                    index + 1;


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "ranking-item";


                if (
                    rank === 1
                ) {

                    item.classList.add(
                        "rank-1"
                    );

                }

                else if (
                    rank === 2
                ) {

                    item.classList.add(
                        "rank-2"
                    );

                }

                else if (
                    rank === 3
                ) {

                    item.classList.add(
                        "rank-3"
                    );

                }


                const name =
                    user.name ||
                    "名無しさん";


                const trip =
                    user.trip ||
                    "";


                const value =
                    Number(
                        user[currentType] || 0
                    );


                item.innerHTML = `

                    <div class="rank">
                        ${getRankIcon(rank)}
                        ${rank}位
                    </div>

                    <div class="user">

                        <div class="name">

                            ${escapeHtml(
                                name
                            )}

                            ${
                                trip
                                ? "：" +
                                  escapeHtml(
                                      trip
                                  )
                                : ""
                            }

                        </div>

                        <div class="value">

                            ${value.toLocaleString()}

                            円

                        </div>

                    </div>

                `;


                ranking.appendChild(
                    item
                );

            }
        );

    }


    // =================================
    // 順位アイコン
    // =================================

    function getRankIcon(
        rank
    ) {

        if (rank === 1) {
            return "🥇";
        }

        if (rank === 2) {
            return "🥈";
        }

        if (rank === 3) {
            return "🥉";
        }

        return "";
    }


    // =================================
    // 検索
    // =================================

    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            renderRanking
        );


    // =================================
    // タブ
    // =================================

    document
        .querySelectorAll(
            ".tabs button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".tabs button"
                            )
                            .forEach(
                                btn => {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        currentType =
                            button.dataset.type;


                        renderRanking();

                    }
                );

            }
        );


    // =================================
    // HTMLエスケープ
    // =================================

    function escapeHtml(
        text
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    // =================================
    // 初回読み込み
    // =================================

    loadRanking();


</script>


</body>

</html>
