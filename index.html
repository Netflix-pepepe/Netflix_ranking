<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NETFRFR RANKING
    </title>


    <style>

        /* ===============================
           BASE
        =============================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            color: #e8ecf4;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans JP",
                sans-serif;

            background:

                radial-gradient(
                    circle at top,
                    #17233d 0%,
                    #090d17 45%,
                    #05070c 100%
                );

        }


        /* ===============================
           BACKGROUND
        =============================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.18;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                );

            background-size:
                45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );

        }


        /* ===============================
           CONTAINER
        =============================== */

        .container {

            width:
                min(
                    1100px,
                    calc(100% - 32px)
                );

            margin:
                35px auto 70px;

        }


        /* ===============================
           HEADER
        =============================== */

        .header {

            position: relative;

            overflow: hidden;

            padding:
                32px;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

            border-radius:
                24px;

            background:

                linear-gradient(
                    135deg,
                    rgba(
                        29,
                        45,
                        79,
                        0.92
                    ),
                    rgba(
                        11,
                        16,
                        30,
                        0.92
                    )
                );

            box-shadow:

                0 25px 70px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }


        .header::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            right: -100px;

            top: -160px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(
                        77,
                        136,
                        255,
                        0.25
                    ),
                    transparent 70%
                );

        }


        .brand {

            position: relative;

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .logo {

            width: 62px;

            height: 62px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            font-size: 29px;

            border-radius: 18px;

            background:

                linear-gradient(
                    135deg,
                    #447cff,
                    #8a4dff
                );

            box-shadow:

                0 10px 35px
                rgba(
                    72,
                    103,
                    255,
                    0.35
                );

        }


        h1 {

            margin: 0;

            font-size:

                clamp(
                    24px,
                    5vw,
                    40px
                );

            letter-spacing:
                0.04em;

        }


        .subtitle {

            margin-top: 5px;

            color: #8490a8;

            font-size: 12px;

            letter-spacing:
                0.18em;

        }


        .status {

            position: relative;

            margin:

                25px 0 0;

            color: #8e9ab0;

            font-size: 13px;

        }


        /* ===============================
           SEARCH
        =============================== */

        .search-box {

            position: relative;

            margin-top: 22px;

        }


        .search-icon {

            position: absolute;

            left: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            opacity: 0.65;

        }


        #search {

            width: 100%;

            padding:

                15px
                18px
                15px
                48px;

            outline: none;

            color: white;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.09
                );

            border-radius: 14px;

            background:

                rgba(
                    0,
                    0,
                    0,
                    0.22
                );

            font-size: 14px;

            transition:
                0.2s;

        }


        #search:focus {

            border-color:
                rgba(
                    90,
                    140,
                    255,
                    0.75
                );

            box-shadow:

                0 0 0 4px
                rgba(
                    67,
                    114,
                    255,
                    0.12
                );

        }


        /* ===============================
           CATEGORY
        =============================== */

        .category-title {

            margin:

                35px 0 12px;

            color: #8794aa;

            font-size: 11px;

            font-weight: 700;

            letter-spacing:
                0.15em;

        }


        .categories {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;

        }


        .category-button {

            cursor: pointer;

            padding:

                10px 16px;

            color: #8e99ad;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            border-radius: 12px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.025
                );

            transition:
                0.2s;

        }


        .category-button:hover {

            color: white;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

        }


        .category-button.active {

            color: white;

            border-color:

                rgba(
                    100,
                    145,
                    255,
                    0.5
                );

            background:

                linear-gradient(
                    135deg,
                    rgba(
                        59,
                        107,
                        255,
                        0.75
                    ),
                    rgba(
                        113,
                        65,
                        255,
                        0.75
                    )
                );

        }


        /* ===============================
           RANKING TABS
        =============================== */

        .tabs {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        145px,
                        1fr
                    )
                );

            gap: 10px;

            margin-top: 12px;

        }


        .tab {

            cursor: pointer;

            min-height: 68px;

            padding: 13px;

            text-align: left;

            color: #8793a9;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            border-radius: 14px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.025
                );

            transition:
                0.2s;

        }


        .tab:hover {

            transform:
                translateY(-2px);

            color: white;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

        }


        .tab.active {

            color: white;

            border-color:

                rgba(
                    87,
                    133,
                    255,
                    0.6
                );

            background:

                linear-gradient(
                    135deg,
                    rgba(
                        47,
                        90,
                        210,
                        0.55
                    ),
                    rgba(
                        78,
                        44,
                        175,
                        0.45
                    )
                );

        }


        .tab-icon {

            display: block;

            margin-bottom: 5px;

            font-size: 19px;

        }


        .tab-name {

            display: block;

            font-size: 13px;

            font-weight: 700;

        }


        /* ===============================
           CURRENT RANKING
        =============================== */

        .ranking-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin:

                35px 0 16px;

        }


        #rankingTitle {

            margin: 0;

            font-size: 20px;

        }


        #rankingDescription {

            margin: 5px 0 0;

            color: #7d899e;

            font-size: 12px;

        }


        .ranking-count {

            color: #69758a;

            font-size: 12px;

            white-space: nowrap;

        }


        /* ===============================
           PODIUM
        =============================== */

        #podium {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 15px;

        }


        .podium-card {

            position: relative;

            overflow: hidden;

            padding: 20px;

            min-height: 180px;

            border-radius: 20px;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.025
                );

        }


        .podium-card.first {

            border-color:

                rgba(
                    255,
                    205,
                    76,
                    0.45
                );

            background:

                linear-gradient(
                    145deg,
                    rgba(
                        255,
                        191,
                        49,
                        0.18
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        0.02
                    )
                );

        }


        .podium-card.second {

            border-color:

                rgba(
                    188,
                    199,
                    220,
                    0.3
                );

        }


        .podium-card.third {

            border-color:

                rgba(
                    193,
                    125,
                    74,
                    0.35
                );

        }


        .podium-medal {

            font-size: 32px;

        }


        .podium-rank {

            margin-top: 8px;

            color: #8a95a9;

            font-size: 12px;

        }


        .podium-name {

            overflow: hidden;

            margin-top: 14px;

            font-size: 17px;

            font-weight: 800;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .podium-trip {

            overflow: hidden;

            margin-top: 5px;

            color: #748096;

            font-size: 10px;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .podium-value {

            margin-top: 18px;

            color: #ffffff;

            font-size: 22px;

            font-weight: 800;

        }


        /* ===============================
           RANKING LIST
        =============================== */

        #ranking {

            display: flex;

            flex-direction: column;

            gap: 8px;

        }


        .ranking-item {

            display: grid;

            grid-template-columns:

                75px
                minmax(0, 1fr)
                auto;

            align-items: center;

            gap: 14px;

            min-height: 76px;

            padding:

                13px 18px;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border-radius: 16px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.025
                );

            transition:
                0.2s;

        }


        .ranking-item:hover {

            transform:
                translateX(4px);

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.055
                );

            border-color:

                rgba(
                    110,
                    150,
                    255,
                    0.28
                );

        }


        .rank {

            color: #8490a5;

            font-weight: 800;

        }


        .rank-number {

            font-size: 16px;

        }


        .user {

            min-width: 0;

        }


        .name {

            overflow: hidden;

            font-size: 15px;

            font-weight: 700;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .trip {

            overflow: hidden;

            margin-top: 5px;

            color: #707d93;

            font-size: 10px;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .value {

            text-align: right;

            color: white;

            font-size: 19px;

            font-weight: 800;

            white-space: nowrap;

        }


        .value-label {

            display: block;

            margin-top: 4px;

            color: #6d7890;

            font-size: 10px;

            font-weight: 500;

        }


        /* ===============================
           EMPTY
        =============================== */

        .empty {

            padding: 55px 20px;

            text-align: center;

            color: #7d8798;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border-radius: 18px;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.02
                );

        }


        /* ===============================
           FOOTER
        =============================== */

        .footer {

            margin-top: 35px;

            padding-bottom: 20px;

            text-align: center;

            color: #566174;

            font-size: 11px;

            letter-spacing: 0.08em;

        }


        /* ===============================
           MOBILE
        =============================== */

        @media (
            max-width: 700px
        ) {

            .container {

                width:
                    calc(
                        100% - 18px
                    );

                margin-top:
                    15px;

            }


            .header {

                padding: 22px 16px;

                border-radius: 20px;

            }


            .logo {

                width: 50px;

                height: 50px;

                font-size: 23px;

                border-radius: 15px;

            }


            .subtitle {

                font-size: 9px;

                letter-spacing: 0.12em;

            }


            .categories {

                display: grid;

                grid-template-columns:

                    repeat(
                        2,
                        1fr
                    );

            }


            .category-button {

                width: 100%;

            }


            .tabs {

                grid-template-columns:

                    repeat(
                        2,
                        1fr
                    );

            }


            #podium {

                grid-template-columns:
                    1fr;

            }


            .podium-card {

                min-height: 130px;

            }


            .ranking-item {

                grid-template-columns:

                    52px
                    minmax(0, 1fr)
                    auto;

                padding:

                    12px 11px;

            }


            .rank {

                font-size: 12px;

            }


            .name {

                font-size: 13px;

            }


            .value {

                font-size: 15px;

            }

        }

    
        /* ===============================
           STOCK TREND CHART
        =============================== */
        .stock-trend-section {
            margin-top: 28px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            background: rgba(10,15,28,0.72);
            box-shadow: 0 20px 55px rgba(0,0,0,0.22);
        }

        .stock-chart-wrap {
            position: relative;
            width: 100%;
            height: 360px;
            margin-top: 16px;
            border-radius: 16px;
            background: rgba(255,255,255,0.025);
            padding: 12px;
        }

        #stockTrendChart {
            width: 100% !important;
            height: 100% !important;
        }

        .stock-chart-note {
            margin: 12px 0 0;
            opacity: 0.62;
            font-size: 12px;
        }


</style>

</head>

/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

================================= */

function getCurrentConfig() {

    const list =
        RANKING_TYPES[
            currentCategory
        ] || [];

    return list.find(
        item =>
            item.key === currentType
    );

}


/* =================================
   FORMAT VALUE
================================= */

function formatValue(
    value,
    config
) {

    let number =
        Number(value || 0);


    if (
        config.key === "crashBest"
    ) {

        return (
            number.toFixed(2)
            +
            config.suffix
        );

    }


    if (
        config.key === "level"
        ||
        config.key === "jobLevel"
    ) {

        return (
            "Lv."
            +
            number.toLocaleString()
        );

    }


    return (
        number.toLocaleString()
        +
        config.suffix
    );

}


/* =================================
   CREATE CATEGORY BUTTONS
================================= */

function renderCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    Object.entries(
        CATEGORIES
    )

    .forEach(
        (
            [
                key,
                category
            ]
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-button";


            if (
                key === currentCategory
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                `${category.icon} ${category.name}`;


            button.addEventListener(
                "click",
                () => {

                    currentCategory =
                        key;


                    const first =
                        RANKING_TYPES[
                            currentCategory
                        ][0];


                    currentType =
                        first.key;


                    renderCategories();

                    renderTabs();

                    renderRanking();
            renderStockTrendChart(data);

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =================================
   CREATE TABS
================================= */

function renderTabs() {

    const container =
        document.getElementById(
            "tabs"
        );


    container.innerHTML = "";


    const types =
        RANKING_TYPES[
            currentCategory
        ] || [];


    types.forEach(
        config => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "tab";


            if (
                config.key === currentType
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.innerHTML = `

                <span
                    class="tab-icon"
                >
                    ${config.icon}
                </span>

                <span
                    class="tab-name"
                >
                    ${escapeHtml(
                        config.name
                    )}
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    currentType =
                        config.key;


                    renderTabs();

                    renderRanking();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =================================
   SEARCH
================================= */

function getFilteredUsers() {

    const search =
        document
        .getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const config =
        getCurrentConfig();


    let filtered =
        users.filter(
            user => {

                const name =
                    String(
                        user.name || ""
                    )
                    .toLowerCase();


                const trip =
                    String(
                        user.trip || ""
                    )
                    .toLowerCase();


                if (
                    !search
                ) {

                    return true;

                }


                return (

                    name.includes(
                        search
                    )

                    ||

                    trip.includes(
                        search
                    )

                );

            }
        );


    filtered.sort(
        (
            a,
            b
        ) => {

            const aValue =
                Number(
                    a[
                        config.key
                    ] || 0
                );


            const bValue =
                Number(
                    b[
                        config.key
                    ] || 0
                );


            if (
                config.reverse
            ) {

                return (
                    aValue
                    -
                    bValue
                );

            }


            return (
                bValue
                -
                aValue
            );

        }
    );


    return filtered;

}


/* =================================
   RANK ICON
================================= */

function getRankIcon(rank) {

    if (
        rank === 1
    ) {

        return "🥇";

    }


    if (
        rank === 2
    ) {

        return "🥈";

    }


    if (
        rank === 3
    ) {

        return "🥉";

    }


    return "🏅";

}


/* =================================
   RENDER PODIUM
================================= */

function renderPodium(
    ranking,
    config
) {

    const podium =
        document.getElementById(
            "podium"
        );


    podium.innerHTML = "";


    const topThree =
        ranking.slice(
            0,
            3
        );


    topThree.forEach(
        (
            user,
            index
        ) => {

            const rank =
                index + 1;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "podium-card";


            if (
                rank === 1
            ) {

                card.classList.add(
                    "first"
                );

            }


            else if (
                rank === 2
            ) {

                card.classList.add(
                    "second"
                );

            }


            else {

                card.classList.add(
                    "third"
                );

            }


            const name =
                user.name ||
                "名無しさん";


            const trip =
                user.trip ||
                "";


            card.innerHTML = `

                <div
                    class="podium-medal"
                >
                    ${getRankIcon(rank)}
                </div>


                <div
                    class="podium-rank"
                >
                    RANK ${rank}
                </div>


                <div
                    class="podium-name"
                >
                    ${escapeHtml(
                        name
                    )}
                </div>


                <div
                    class="podium-trip"
                >
                    ${
                        trip
                        ? escapeHtml(
                            trip
                        )
                        : "NO TRIP"
                    }
                </div>


                <div
                    class="podium-value"
                >
                    ${formatValue(
                        user[
                            config.key
                        ],
                        config
                    )}
                </div>

            `;


            podium.appendChild(
                card
            );

        }
    );

}


/* =================================
   RENDER RANKING
================================= */

function renderRanking() {

    const config =
        getCurrentConfig();


    if (
        !config
    ) {

        return;

    }


    const ranking =
        getFilteredUsers();


    document
    .getElementById(
        "rankingTitle"
    )
    .textContent =

        `${config.icon} ${config.name}ランキング`;


    document
    .getElementById(
        "rankingDescription"
    )
    .textContent =

        config.description;


    document
    .getElementById(
        "rankingCount"
    )
    .textContent =

        `${ranking.length} PLAYERS`;


    const rankingElement =
        document.getElementById(
            "ranking"
        );


    rankingElement.innerHTML =
        "";


    if (
        ranking.length === 0
    ) {

        document
        .getElementById(
            "podium"
        )
        .innerHTML =
            "";


        rankingElement.innerHTML = `

            <div
                class="empty"
            >

                🔎<br><br>

                該当するプレイヤーが
                いません

            </div>

        `;


        return;

    }


    renderPodium(
        ranking,
        config
    );


    ranking.forEach(
        (
            user,
            index
        ) => {

            const rank =
                index + 1;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "ranking-item";


            const name =
                user.name ||
                "名無しさん";


            const trip =
                user.trip ||
                "";


            item.innerHTML = `

                <div
                    class="rank"
                >

                    ${getRankIcon(rank)}

                    <span
                        class="rank-number"
                    >
                        ${rank}位
                    </span>

                </div>


                <div
                    class="user"
                >

                    <div
                        class="name"
                    >
                        ${escapeHtml(
                            name
                        )}
                    </div>


                    <div
                        class="trip"
                    >

                        ${
                            trip
                            ? escapeHtml(
                                trip
                            )
                            : "NO TRIP"
                        }

                    </div>

                </div>


                <div
                    class="value"
                >

                    ${formatValue(
                        user[
                            config.key
                        ],
                        config
                    )}

                    <span
                        class="value-label"
                    >
                        ${escapeHtml(
                            config.name
                        )}
                    </span>

                </div>

            `;


            rankingElement.appendChild(
                item
            );

        }
    );

}


/* =================================
   LOAD DATA
================================= */


    // =================================
    // 株式資産 推移グラフ
    // =================================
    let stockTrendChart = null;
    let stockTrendHistory = [];

    function normalizeStockHistory(data) {
        const candidates = [
            data.stockRankingHistory,
            data.stock_ranking_history,
            data.stockHistory,
            data.stock_history,
            data.stockAssetsHistory,
            data.stock_assets_history
        ];

        const raw = candidates.find(Array.isArray);
        if (!raw) return [];

        // 想定:
        // [
        //   {
        //     "time": "...",
        //     "rows": [
        //       {"name":"名前","trip":"トリップ","uid":"...","stockAssets":12345}
        //     ]
        //   }
        // ]
        return raw
            .filter(snapshot => snapshot && Array.isArray(snapshot.rows))
            .map(snapshot => ({
                time: snapshot.time || "",
                rows: snapshot.rows
                    .map(row => ({
                        name: String(row.name || ""),
                        trip: String(row.trip || ""),
                        uid: String(row.uid || row.trip || ""),
                        value: Number(
                            row.stockAssets ??
                            row.equity ??
                            row.value ??
                            0
                        )
                    }))
                    .filter(row => Number.isFinite(row.value))
            }));
    }

    function renderStockTrendChart(data) {
        const section = document.getElementById("stockTrendSection");
        const canvas = document.getElementById("stockTrendChart");

        if (!section || !canvas) return;

        stockTrendHistory = normalizeStockHistory(data);

        // 株式資産ランキングを選択している時だけ表示。
        if (currentType !== "stockAssets" || stockTrendHistory.length === 0) {
            section.style.display = "none";
            if (stockTrendChart) {
                stockTrendChart.destroy();
                stockTrendChart = null;
            }
            return;
        }

        const latest = stockTrendHistory[stockTrendHistory.length - 1];
        const topPlayers = [...latest.rows]
            .sort((a, b) => b.value - a.value)
            .slice(0, 5);

        if (topPlayers.length === 0) {
            section.style.display = "none";
            return;
        }

        section.style.display = "";

        const labels = stockTrendHistory.map((snapshot, i) => {
            if (snapshot.time) {
                const d = new Date(snapshot.time);
                if (!Number.isNaN(d.getTime())) {
                    return d.toLocaleDateString("ja-JP", {
                        month: "numeric",
                        day: "numeric"
                    });
                }
            }
            return `${i + 1}`;
        });

        const datasets = topPlayers.map(player => {
            const values = stockTrendHistory.map(snapshot => {
                const row = snapshot.rows.find(r =>
                    (player.uid && r.uid === player.uid) ||
                    (
                        r.name === player.name &&
                        r.trip === player.trip
                    )
                );
                return row ? row.value : null;
            });

            const label =
                player.name
                    ? `${player.name}：${player.trip || "NO TRIP"}`
                    : player.uid;

            return {
                label,
                data: values,
                tension: 0.28,
                spanGaps: true,
                pointRadius: 3,
                pointHoverRadius: 5
            };
        });

        if (stockTrendChart) {
            stockTrendChart.destroy();
        }

        stockTrendChart = new Chart(canvas.getContext("2d"), {
            type: "line",
            data: {
                labels,
                datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: "index",
                    intersect: false
                },
                plugins: {
                    legend: {
                        position: "bottom"
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                return `${context.dataset.label}: ${Number(context.parsed.y || 0).toLocaleString()}円`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback(value) {
                                return Number(value).toLocaleString() + "円";
                            }
                        }
                    }
                }
            }
        });
    }


async function loadRanking() {

    try {

        const response =
            await fetch(
                "./ranking.json"
                +
                "?t="
                +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * ranking.json
         *
         * {
         *     "users": [
         *         {
         *             "name": "...",
         *             "trip": "...",
         *             "money": 1000
         *         }
         *     ]
         * }
         */


        if (
            Array.isArray(
                data.users
            )
        ) {

            users =
                data.users;

        }


        else if (
            Array.isArray(
                data
            )
        ) {

            users =
                data;

        }


        else {

            throw new Error(
                "JSON FORMAT ERROR"
            );

        }


        document
        .getElementById(
            "status"
        )
        .textContent =

            "🟢 ランキングデータ接続中";


        document
        .getElementById(
            "updated"
        )
        .textContent =

            "LAST UPDATE: "
            +
            new Date()
            .toLocaleString(
                "ja-JP"
            );


        renderCategories();

        renderTabs();

        renderRanking();

    }


    catch (
        error
    ) {

        console.error(
            error
        );


        document
        .getElementById(
            "status"
        )
        .textContent =

            "🔴 ランキングデータ取得失敗";


        document
        .getElementById(
            "podium"
        )
        .innerHTML =
            "";


        document
        .getElementById(
            "ranking"
        )
        .innerHTML = `

            <div
                class="empty"
            >

                ⚠️<br><br>

                ranking.json を
                取得できませんでした。

            </div>

        `;

    }

}

   SEARCH EVENT
================================= */

document
.getElementById(

)
.addEventListener(

    renderRanking
);


/* =================================
   START
================================= */

loadRanking();

setInterval(

);
