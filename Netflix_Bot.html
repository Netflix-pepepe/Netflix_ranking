<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ランキングまとめ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>ランキングまとめ</h1>

        <p class="status" id="status">
            🛜接続中...
        </p>


        <!-- 検索 -->

        <input
            type="text"
            id="search"
            placeholder="🔍ユーザーを検索"
        >


        <!-- ランキング切り替え -->

        <div class="tabs">

            <button
                class="active"
                data-type="totalAssets"
            >
                🔱総資産
            </button>

            <button
                data-type="money"
            >
                💰所持金
            </button>

            <button
                data-type="bank"
            >
                🏦銀行
            </button>

            <button
                data-type="stockAssets"
            >
                📈株式資産
            </button>

        </div>


        <!-- ランキング -->

        <div id="ranking">

            <p>
                データを読み込んでいます...
            </p>

        </div>

    </div>


    <!-- Firebase -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // Firebase設定
        // Firebase ConsoleのWebアプリ登録時に表示されたものに変更

        const firebaseConfig = {
          apiKey: "AIzaSyBusKKsB9awE6EGwujPhQL3-GwhL9oEzY0",
          authDomain: "rankingall.firebaseapp.com",
          databaseURL: "https://rankingall-default-rtdb.firebaseio.com",
          projectId: "rankingall",
          storageBucket: "rankingall.firebasestorage.app",
          messagingSenderId: "348542743099",
          appId: "1:348542743099:web:cc21e0c159d52c72cd221e",
          measurementId: "G-WTBRMKYDSK"
        };


        // Firebase初期化

        const app =
            initializeApp(
                firebaseConfig
            );


        // Database

        const database =
            getDatabase(app);


        // usersデータを取得

        const usersRef =
            ref(
                database,
                "ranking/users"
            );


        let users = [];

        let currentType =
            "totalAssets";


        // リアルタイム監視

        onValue(
            usersRef,
            (snapshot) => {

                const data =
                    snapshot.val();


                users = [];


                if (data) {

                    Object.entries(
                        data
                    ).forEach(
                        ([uid, user]) => {

                            users.push({

                                uid: uid,

                                ...user

                            });

                        }
                    );

                }


                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "🟢リアルタイム接続中";


                renderRanking();

            },

            (error) => {

                console.error(
                    error
                );


                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "🔴Firebase接続エラー";

            }
        );


        // ランキング表示

        function renderRanking() {

            const search =
                document
                    .getElementById(
                        "search"
                    )
                    .value
                    .toLowerCase();


            const filtered =
                users.filter(
                    user => {

                        const name =
                            String(
                                user.name || ""
                            )
                            .toLowerCase();


                        return name.includes(
                            search
                        );

                    }
                );


            filtered.sort(
                (
                    a,
                    b
                ) => {

                    return (
                        Number(
                            b[currentType] || 0
                        )
                        -
                        Number(
                            a[currentType] || 0
                        )
                    );

                }
            );


            const ranking =
                document
                    .getElementById(
                        "ranking"
                    );


            ranking.innerHTML =
                "";


            if (
                filtered.length === 0
            ) {

                ranking.innerHTML =
                    "<p>該当するユーザーがいません。</p>";

                return;

            }


            filtered.forEach(
                (
                    user,
                    index
                ) => {

                    const rank =
                        index + 1;


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "ranking-item";


                    if (
                        rank === 1
                    ) {

                        item.classList.add(
                            "rank-1"
                        );

                    }

                    else if (
                        rank === 2
                    ) {

                        item.classList.add(
                            "rank-2"
                        );

                    }

                    else if (
                        rank === 3
                    ) {

                        item.classList.add(
                            "rank-3"
                        );

                    }


                    item.innerHTML = `

                        <div class="rank">
                            ${rank}位
                        </div>

                        <div class="user">

                            <div class="name">
                                ${escapeHtml(
                                    user.name || user.uid
                                )}
                            </div>

                            <div class="value">
                                ${Number(
                                    user[currentType] || 0
                                ).toLocaleString()}
                                円
                            </div>

                        </div>

                    `;


                    ranking.appendChild(
                        item
                    );

                }
            );

        }


        // 検索

        document
            .getElementById(
                "search"
            )
            .addEventListener(
                "input",
                renderRanking
            );


        // タブ

        document
            .querySelectorAll(
                ".tabs button"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".tabs button"
                                )
                                .forEach(
                                    btn => {

                                        btn.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            currentType =
                                button.dataset.type;


                            renderRanking();

                        }
                    );

                }
            );


        // HTMLエスケープ

        function escapeHtml(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }

    </script>

</body>

</html>
